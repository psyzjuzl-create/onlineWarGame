<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Two-Player Online Game</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef2f7;color:#17202a}#top{display:flex;gap:10px;align-items:center;padding:10px;background:white;flex-wrap:wrap}input,button{padding:7px}#status{font-weight:700}.wrap{position:relative;height:calc(100vh - 64px)}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.78);color:white;text-align:center}.overlay.show{display:flex}.panel{padding:28px;border:1px solid rgba(255,255,255,.4);border-radius:14px;background:rgba(15,23,42,.9)}
</style></head><body>
<div id="top"><label>rows <input id="rows" type="number" value="6" min="6" max="6" readonly></label><label>columns <input id="cols" type="number" value="6" min="6" max="6" readonly></label><label>games x <input id="games" type="number" value="3" min="1" max="100"></label><button id="connect">start matching</button><span id="status">not connected</span><span id="role" style="font-weight:700"></span></div>
<div class="wrap"><canvas id="c"></canvas><div id="overlay" class="overlay"><div class="panel"><h2 id="ovTitle"></h2><p id="ovText"></p></div></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),statusEl=document.getElementById('status'),roleEl=document.getElementById('role'),overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText');let ws=null,board=null,rows=6,cols=8,selected=new Set(),phase='idle',submitted=false,flash=new Set(),deadline=0,timer=null;
function key(r,c){return r+','+c} function resize(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=(innerHeight-64)*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);if(!board)return;const pad=30,w=innerWidth-2*pad,h=innerHeight-120,s=Math.max(5,Math.min(w/cols,h/rows)),ox=(innerWidth-s*cols)/2,oy=(innerHeight-64-s*rows)/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const x=ox+col*s,y=oy+r*s,k=key(r,col),code=board.colors[r][col];ctx.fillStyle=selected.has(k)?'#27ae60':code===1?'#3498db':code===2?'#e74c3c':'#fff';ctx.fillRect(x,y,s,s);ctx.strokeStyle=flash.has(k)?'#facc15':'#17202a';ctx.lineWidth=flash.has(k)?Math.max(4,s*.08):1;ctx.strokeRect(x,y,s,s);const fg=code===0&&!selected.has(k)?'#17202a':'#fff';ctx.strokeStyle=fg;ctx.lineWidth=Math.max(2,s*.05);const cx=x+s/2,cy=y+s/2,sh=board.shapes[r][col];if(sh===1){ctx.beginPath();ctx.arc(cx,cy,s*.39,0,Math.PI*2);ctx.stroke()}else if(sh===2){ctx.beginPath();ctx.moveTo(cx,cy-s*.42);ctx.lineTo(cx+s*.42,cy);ctx.lineTo(cx,cy+s*.42);ctx.lineTo(cx-s*.42,cy);ctx.closePath();ctx.stroke()}const n=board.numbers[r][col];if(n!==-1){ctx.fillStyle=fg;ctx.font='700 '+Math.max(10,s*.24)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,cx,cy)}}}
function cellAt(e){if(!board)return null;const rect=c.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,pad=30,w=innerWidth-2*pad,h=innerHeight-120,s=Math.max(5,Math.min(w/cols,h/rows)),ox=(innerWidth-s*cols)/2,oy=(innerHeight-64-s*rows)/2;if(x<ox||y<oy||x>=ox+s*cols||y>=oy+s*rows)return null;return [Math.floor((y-oy)/s),Math.floor((x-ox)/s)]}
c.addEventListener('click',e=>{if(phase!=='turn'||submitted)return;const p=cellAt(e);if(p){selected.add(key(...p));draw()}});c.addEventListener('contextmenu',e=>{e.preventDefault();if(phase!=='turn'||submitted)return;const p=cellAt(e);if(p){selected.delete(key(...p));draw()}});
function submit(){if(!ws||ws.readyState!==1)return;if(phase==='turn'&&!submitted){submitted=true;ws.send(JSON.stringify({type:'submit',cells:[...selected].map(x=>x.split(',').map(Number))}));statusEl.textContent='Submitted, waiting for opponent'}else if(phase==='rest'){ws.send(JSON.stringify({type:'rest_ready'}));ovText.textContent='Ready, waiting for opponent or the 60-second break to end';phase='rest_wait'}}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();submit()}});
function countdown(seconds,prefix){deadline=Date.now()+seconds*1000;clearInterval(timer);timer=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));statusEl.textContent=prefix+left+' seconds';if(left<=0)clearInterval(timer)},250)}
document.getElementById('connect').onclick=()=>{roleEl.textContent='';rows=+document.getElementById('rows').value;cols=+document.getElementById('cols').value;const g=+document.getElementById('games').value;const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host+'/ws');ws.onopen=()=>ws.send(JSON.stringify({rows,cols,totalGames:g}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='waiting')statusEl.textContent='Waiting for a match';else if(m.type==='matched'){statusEl.textContent='Match found';roleEl.textContent=m.player===1?'You are the circle player':'You are the diamond player';}else if(m.type==='state'){rows=m.rows;cols=m.cols;board=m.board;selected.clear();submitted=false;phase=m.phase;overlay.classList.remove('show');flash=new Set((m.flashing||[]).map(p=>key(...p)));if(m.phase==='turn'){countdown(m.seconds,`Game ${m.game}/${m.totalGames}, Turn ${m.turn}/${m.turnsPerGame}, remaining: `)}else if(m.phase==='turn_result'){statusEl.textContent='Turn results';setTimeout(()=>{flash.clear();draw()},1000)}else if(m.phase==='rest'){phase='rest';overlay.classList.add('show');ovTitle.textContent=`Game ${m.game} ended`;ovText.textContent='Both players press Space to start the next game; break is up to 60 seconds';countdown(m.seconds,'Break remaining: ')}else statusEl.textContent=`Game ${m.game} started`;draw()}else if(m.type==='auto_selected')statusEl.textContent='Time expired: the server made a random selection';else if(m.type==='rest_complete'){overlay.classList.remove('show');statusEl.textContent='The next game will start shortly'}else if(m.type==='game_over'){phase='over';overlay.classList.add('show');ovTitle.textContent='Game over';ovText.textContent='All games have been completed';statusEl.textContent='Game over'}else if(m.type==='opponent_left'){overlay.classList.add('show');ovTitle.textContent='Opponent left';ovText.textContent='Please refresh the page and match again'}};ws.onclose=()=>statusEl.textContent='Connection closed'};resize();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"7939e04a4baf43c8b86a560f74aac60e"}' crossorigin="anonymous"></script>
</body></html>
